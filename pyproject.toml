[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "viewalyzer-sdk"
dynamic = ["version"]
description = "Python SDK for the ViewAlyzer headless CLI - automate embedded trace capture, queries, and regression tests in CI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Free Radical Labs" }]
keywords = [
    "embedded",
    "rtos",
    "tracing",
    "profiler",
    "ci",
    "regression-testing",
    "viewalyzer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# Stdlib only (subprocess, json, sqlite3) - keep it that way.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
viewalyzer-doctor = "viewalyzer_sdk.__main__:main"

[project.urls]
Homepage = "https://viewalyzer.net"
Documentation = "https://viewalyzer.net/docs.html"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viewalyzer_sdk = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "viewalyzer_sdk.__version__" }
